[package]
name = "wk_golf"
version = "0.1.0"
edition = "2021"
description = "WormKit mini-golf — grenade as ball, stock physics only."

[lib]
name = "wkGolf"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
